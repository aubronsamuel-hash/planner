version: "3.9"
services:
  backend:
    build:
      context: ../..
      dockerfile: infra/docker/backend/Dockerfile
    environment:
      PLANNER_REDIS_URL: redis://redis:6379/0
      PLANNER_LOKI_URL: http://loki:3100/loki/api/v1/push
      PLANNER_JWT_SECRET: dev-secret
      PLANNER_ACCESS_TOKEN_MINUTES: 15
      PLANNER_REFRESH_TOKEN_MINUTES: 1440
      PLANNER_LOG_LEVEL: INFO
    volumes:
      - ../..:/workspace
      - ../../secrets/.env.dev:/workspace/backend/.env:ro
    ports:
      - "8000:8000"
    depends_on:
      - postgres
  frontend:
    build:
      context: ../..
      dockerfile: infra/docker/frontend/Dockerfile
    working_dir: /workspace/frontend
    command: pnpm run dev -- --host 0.0.0.0 --port 5173
    volumes:
      - ../..:/workspace
    ports:
      - "5173:5173"
    depends_on:
      - backend
  worker:
    build:
      context: ../..
      dockerfile: infra/docker/worker/Dockerfile
    command: python -m backend.app.worker.main
    environment:
      PLANNER_REDIS_URL: redis://redis:6379/0
      PLANNER_LOKI_URL: http://loki:3100/loki/api/v1/push
      PLANNER_WORKER_METRICS_PORT: "9000"
    volumes:
      - ../..:/workspace
    ports:
      - "9000:9000"
    depends_on:
      - backend
      - redis
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: planner
      POSTGRES_USER: planner
      POSTGRES_PASSWORD: planner
    ports:
      - "5432:5432"
  prometheus:
    build:
      context: ../..
      dockerfile: infra/docker/prometheus/Dockerfile
    volumes:
      - ../docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - backend
      - worker

  loki:
    image: grafana/loki:2.9.4
    command: -config.file=/etc/loki/local-config.yml
    ports:
      - "3100:3100"
    volumes:
      - ../docker/loki/local-config.yml:/etc/loki/local-config.yml:ro

  grafana:
    image: grafana/grafana:10.4.3
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SECURITY_ADMIN_USER=admin
    volumes:
      - ../docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
