version: "3.9"
services:
  backend:
    image: ghcr.io/org/planner-backend:latest
    environment:
      UVICORN_WORKERS: 4
      FEATURE_FLAG_DASHBOARD: "true"
    ports:
      - "8000:8000"
  frontend:
    image: ghcr.io/org/planner-frontend:latest
    environment:
      NODE_ENV: production
      FEATURE_FLAG_DASHBOARD: "true"
    ports:
      - "80:80"
  worker:
    image: ghcr.io/org/planner-worker:latest
    depends_on:
      - backend
  prometheus:
    build:
      context: ../docker/prometheus
      dockerfile: Dockerfile
    ports:
      - "9090:9090"
    depends_on:
      - backend
      - worker
