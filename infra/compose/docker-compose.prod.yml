version: "3.9"
services:
  backend:
    image: ghcr.io/org/planner-backend:latest
    environment:
      - UVICORN_WORKERS=4
    ports:
      - "8000:8000"
  frontend:
    image: ghcr.io/org/planner-frontend:latest
    environment:
      - NODE_ENV=production
    ports:
      - "80:80"
  worker:
    image: ghcr.io/org/planner-worker:latest
    depends_on:
      - backend
  prometheus:
    image: prom/prometheus:v2.52.0
    volumes:
      - ../docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
