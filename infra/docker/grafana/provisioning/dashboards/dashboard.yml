apiVersion: 1

disableDeletion: false
disableInitializationWhenEmbedded: false

datasources:
  - name: Prometheus
    type: prometheus
  - name: Loki
    type: loki

dashboardProviders:
  - name: planner-dashboards
    type: file
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: true
