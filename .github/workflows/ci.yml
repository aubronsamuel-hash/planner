name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Backend lint placeholder
        run: |
          echo "Backend linting placeholder until tooling is configured."
      - name: Frontend lint placeholder
        run: |
          echo "Frontend linting placeholder until tooling is configured."
      - name: Report status
        run: |
          echo "Phase 1 CI scaffold complete"
