name: Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  WORKER_IMAGE: planner-worker

jobs:
  build-worker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push planner-worker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/worker/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.WORKER_IMAGE }}:latest
      - name: Build backend image for metrics validation
        run: docker build -t planner-backend:test -f infra/docker/backend/Dockerfile .
      - name: Validate backend metrics endpoint
        run: |
          container_id=$(docker run -d -p 8000:8000 planner-backend:test)
          trap 'docker rm -f "$container_id"' EXIT
          sleep 5
          curl --fail http://127.0.0.1:8000/metrics > backend-metrics.txt
          cat backend-metrics.txt
      - name: Upload Prometheus scrape sample
        uses: actions/upload-artifact@v4
        with:
          name: backend-metrics
          path: backend-metrics.txt
